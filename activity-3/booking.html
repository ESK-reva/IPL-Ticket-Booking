<!-- 5. Booking Form and Summary Card -->
       <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../activity%202/style.css">
    <title>IPL 2026 Ticket Booking</title> 
    
</head>
<body>
    <section id="booking">

            <h2>Book Your Ticket</h2>
            <div class="booking-container">
            

                <!-- Booking Form -->
                <form id="bookingForm">

                    <h3>Ticket Booking Form</h3>

                    <label >Select Match:</label>
                    <select >
                        <option value="1">CSK vs RCB</option>
                        <option value="2">MI vs KKR</option>
                        <option value="3">RCB vs MI</option>
                        <option value="4">CSK vs KKR</option>
                    </select>
                    <br>
                    <label >Stand Category:</label>

                    <select >
                        <option value="General">General</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>
                    <br>
                    <label >Number of Tickets:</label>

                    <input type="number" id="quantity" 
                        min="1" max="10" value="1" required>
                    <br>
                    <label >Full Name:</label>

                    <input type="text" id="name"
                        placeholder="Enter your name" required>
                    <br>
                    <label for="email">Email:</label>

                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                    <br>
                    <label >Phone Number:</label>

                    <input type="tel" id="phone"
                        placeholder="Enter number"
                        pattern="[0-9]{10}"
                        maxlength="10" required>
                    <br>
                    <button type="submit">Confirm Booking</button>
                    <button type="reset">Reset Form</button>
                </form>

                <!-- Booking Summary Card -->
                <aside class="summary">

                    <h3>Booking Summary</h3>

                    <p>
                        Match: CSK vs RCB
                        
                    </p>

                    <p>
                        Venue: Chennai
                        <!--span id="summaryVenue">Chennai</span-->
                    </p>

                    <p>
                        Stand: General
                        <!--span id="summaryCategory">General</span-->
                    </p>

                    <p>
                        Ticket Price: ₹800
                        <!--span id="summaryPrice">800</span-->
                    </p>

                    <p>
                        Quantity: 1
                        <!--span id="summaryQuantity">1</span-->
                    </p>

                    <h3>
                        Total Amount: ₹800<!--span id="total">800</span-->
                    </h3>

               <!--p id="bookingMessage" aria-live="polite"></p-->
            </div>                

            

        </section>
</body>
</html>
